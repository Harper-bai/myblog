# loose page — Hugo site configuration
# Theme: themes/baty

baseURL = "https://harp83.us.kg/"
locale = "zh-CN"
defaultContentLanguage = "zh-cn"
title = "loose page"
theme = "baty"
enableRobotsTXT = true
ignoreFiles = ['^(?:.*/)?AGENTS\.md$', 'content/templates/']

[pagination]
  pagerSize = 20

[permalinks]
  posts = "/posts/:year/:month/:contentbasename/"
  journal = "/journal/:slug/"

[taxonomies]
  tag = "tags"

[outputs]
  home    = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

# RSS 沿用旧 Astro 站的 /rss.xml；Hugo 默认的 baseName 是 index，会输出 /index.xml。
# 旧站订阅者订阅的是 /rss.xml，改名后该地址失效。
[outputFormats.RSS]
  baseName = "rss"

# 搜索暂时停用；恢复时把 "SearchIndex" 加回 home 输出。
[outputFormats.SearchIndex]
  mediaType = "application/json"
  baseName = "search-index"
  isPlainText = true
  notAlternative = true

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions]
    typographer = false
  [markup.highlight]
    noClasses = false

[params]
  author = "Harper"
  description = "Harper 的个人博客，记录生活、想法与不设主题的文字。"
  avatar = "img/avatar-harper.png"
  # fediverse 与社交链接暂未提供；留空时页脚不显示对应入口。
  email = "heyharper@smailr.com"
  fediverse = ""
  # 站点默认社交卡片：关于页照片，1200×800。
  ogImage = "images/about.jpeg"
  ogImageWidth = 1200
  ogImageHeight = 800
  footerTagline = ""

  [params.social]
    mastodon = ""
    flickr = ""

[[menu.main]]
  name = "POSTS"
  pageRef = "/posts"
  weight = 10

[[menu.main]]
  name = "JOURNAL"
  pageRef = "/journal"
  weight = 20

[[menu.main]]
  name = "ABOUT"
  pageRef = "/about"
  weight = 30

[[menu.main]]
  name = "RSS"
  url = "/rss.xml"
  weight = 50
